# -----------------------------------------------------------------------------
# Alarmo <-> keypad bridge over MQTT
#
# Uses Alarmo's built-in MQTT support (Alarmo > General > MQTT, enabled,
# "Require code" on, default topics/payloads). No automation or blueprint.
#
#   <prefix>/state    (retained)  disarmed | arming | armed_home | armed_away |
#                                 pending | triggered | ...
#   <prefix>/event    (JSON)      ARM_AWAY/ARM_HOME {delay}, TRIGGER {delay, sensors},
#                                 FAILED_TO_ARM {sensors}, INVALID_CODE_PROVIDED,
#                                 NO_CODE_PROVIDED, COMMAND_NOT_ALLOWED
#   <prefix>/command  (published) {"command":"ARM_HOME|ARM_AWAY|DISARM","code":"..."}
#
# Keypad logic lives in packages/alarm.yaml; this file is only the transport.
# The broker login is not compiled in. It is set from Home Assistant through the
# config entities below (stored in flash) and applied at runtime.
# -----------------------------------------------------------------------------

mqtt:
  id: mqtt_client
  # Placeholder - replaced at runtime from the "MQTT Broker" entity.
  broker: homeassistant.local
  enable_on_boot: false
  # Only used to talk to Alarmo: no discovery, no entity state topics, no logs.
  discovery: false
  topic_prefix: null
  log_topic: null
  birth_message:
  will_message:
  shutdown_message:
  reboot_timeout: 0s
  on_connect:
    - globals.set: {id: link_mqtt, value: "true"}
    - script.execute: refresh_status
  on_disconnect:
    - globals.set: {id: link_mqtt, value: "false"}
    - script.execute: refresh_status

globals:
  # Broker password (never published - see mqtt_pass).
  - id: mqtt_pass_value
    type: std::string
    restore_value: false
    initial_value: '""'
  # Topic prefix the subscriptions currently use (to unsubscribe on change).
  - id: subscribed_prefix
    type: std::string
    restore_value: false
    initial_value: '""'

text:
  - platform: template
    id: mqtt_broker
    name: "MQTT Broker"
    icon: mdi:server-network
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "homeassistant.local"
    max_length: 64
    on_value:
      - script.execute: mqtt_apply
  - platform: template
    id: mqtt_user
    name: "MQTT Username"
    icon: mdi:account
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    initial_value: ""
    max_length: 64
    on_value:
      - script.execute: mqtt_apply
  # The real password is kept on the device (flash + mqtt_pass_value); HA only
  # ever sees a mask, so it never lands in HA's history or activity log.
  # Not optimistic: the set_action publishes the mask instead of the value.
  - platform: template
    id: mqtt_pass
    name: "MQTT Password"
    icon: mdi:form-textbox-password
    entity_category: config
    mode: password
    optimistic: false
    restore_value: true
    initial_value: ""
    max_length: 64
    set_action:
      - lambda: |-
          id(mqtt_pass_value) = x;
          id(mqtt_pass).publish_state(x.empty() ? "" : "\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022");
      - script.execute: mqtt_apply
    # At boot the restored (real) value is published before HA connects:
    # keep it, then replace it with the mask.
    on_value:
      - lambda: |-
          static const std::string MASK = "\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022";
          if (x.empty() || x == MASK) return;
          id(mqtt_pass_value) = x;
          id(mqtt_pass).publish_state(MASK);
  - platform: template
    id: alarmo_prefix
    name: "Alarmo Topic Prefix"
    icon: mdi:shield-home
    entity_category: config
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "alarmo"
    max_length: 64
    on_value:
      - script.execute: mqtt_apply

number:
  - platform: template
    id: mqtt_port
    name: "MQTT Port"
    icon: mdi:ethernet
    entity_category: config
    min_value: 1
    max_value: 65535
    step: 1
    initial_value: 1883
    restore_value: true
    optimistic: true
    mode: box
    on_value:
      - script.execute: mqtt_apply

binary_sensor:
  - platform: template
    id: mqtt_connected
    name: "MQTT Connected"
    device_class: connectivity
    entity_category: diagnostic
    lambda: "return id(mqtt_client)->is_connected();"

script:
  # (Re)configure the MQTT client from the config entities. Debounced so that
  # filling in several fields in a row only reconnects once.
  - id: mqtt_apply
    mode: restart
    then:
      - delay: 2s
      - lambda: |-
          auto *m = id(mqtt_client);
          m->disable();
          const std::string host = id(mqtt_broker).state;
          const std::string user = id(mqtt_user).state;
          id(login_set) = !user.empty();
          if (host.empty() || user.empty()) {
            ESP_LOGW("alarmo", "MQTT not configured - set MQTT Broker/Username/Password in Home Assistant");
            id(synced) = false;
            return;
          }
          m->set_broker_address(host);
          m->set_broker_port((uint16_t) id(mqtt_port).state);
          m->set_username(user);
          m->set_password(id(mqtt_pass_value));

          // Move subscriptions to the (possibly new) topic prefix.
          std::string prefix = id(alarmo_prefix).state;
          if (prefix.empty()) prefix = "alarmo";
          if (prefix != id(subscribed_prefix)) {
            if (!id(subscribed_prefix).empty()) {
              m->unsubscribe(id(subscribed_prefix) + "/state");
              m->unsubscribe(id(subscribed_prefix) + "/event");
            }
            id(synced) = false;
            m->subscribe(prefix + "/state", [](const std::string &topic, const std::string &payload) {
              id(on_alarm_state).execute(payload);
            });
            m->subscribe(prefix + "/event", [](const std::string &topic, const std::string &payload) {
              id(on_alarm_event).execute(payload);
            });
            id(subscribed_prefix) = prefix;
          }
          ESP_LOGI("alarmo", "MQTT -> %s:%d as '%s', topics %s/#", host.c_str(),
                   (int) id(mqtt_port).state, user.c_str(), prefix.c_str());
          m->enable();
      - script.execute: refresh_status

  # Publish a command to Alarmo. The code is only included when one was typed.
  - id: send_command
    parameters:
      cmd: string
      code: string
    then:
      - mqtt.publish:
          topic: !lambda |-
            std::string p = id(alarmo_prefix).state;
            return (p.empty() ? std::string("alarmo") : p) + "/command";
          payload: !lambda |-
            std::string out = "{\"command\":\"" + cmd + "\"";
            if (!code.empty()) out += ",\"code\":\"" + code + "\"";
            return out + "}";
          qos: 1
          retain: false
