# -----------------------------------------------------------------------------
# Desktop preview of the main screen + PIN pad (ESPHome host + SDL).
#
#   esphome compile preview/preview.yaml
#   preview/render.sh            # renders every scenario to preview/out/*.png
#
# Uses the real theme / alarm logic / main UI packages; hardware and MQTT are
# replaced by the stubs below. SCENARIO picks the state, SNAP the output file.
# -----------------------------------------------------------------------------

substitutions:
  brand_dir: ../assets/brand

esphome:
  name: keypad-preview
  platformio_options:
    build_flags:
      - -DLV_USE_SNAPSHOT=1
  on_boot:
    priority: -100
    then:
      - script.execute: run_scenario

host:
logger:
  level: INFO

display:
  - platform: sdl
    id: main_display
    dimensions: {width: 480, height: 480}
    auto_clear_enabled: false
    update_interval: never
touchscreen:
  - platform: sdl
    id: main_touch

packages:
  theme: !include ../packages/theme.yaml
  alarm: !include ../packages/alarm.yaml
  ui_main: !include ../packages/ui-main.yaml

json:

lvgl:
  displays: main_display
  touchscreens: main_touch
  pages:
    - id: pg_settings
      skip: true
      widgets:
        - label: {align: CENTER, text: "Settings (device only)"}

script:
  # ---- Stubs for hooks the device packages provide ---------------------------
  - id: wake_screen
    then: []
  - id: onboarding_advance
    then: []
  - id: prefs_changed
    then:
      - script.execute: refresh_ui
  - id: send_command
    parameters:
      cmd: string
      code: string
    then:
      - logger.log:
          format: "send_command %s (code %s)"
          args: ['cmd.c_str()', 'code.empty() ? "none" : "given"']

  # ---- Scenario driver --------------------------------------------------------
  - id: run_scenario
    then:
      - lambda: |-
          const char *e = getenv("SCENARIO");
          std::string sc = e ? e : "disarmed";
          id(link_wifi) = true;
          id(link_mqtt) = sc != "offline";
          id(login_set) = true;
          auto st = [](const char *s) { id(on_alarm_state).execute(std::string(s)); };
          auto ev = [](const char *j) { id(on_alarm_event).execute(std::string(j)); };
          if (sc == "offline") { /* nothing synced */ }
          else if (sc == "disarmed") st("disarmed");
          else if (sc == "blocked") { st("disarmed"); ev("{\"event\":\"FAILED_TO_ARM\",\"sensors\":[{\"entity_id\":\"binary_sensor.back_door\",\"name\":\"Back Door\"}]}"); }
          else if (sc == "arming") { st("disarmed"); ev("{\"event\":\"ARM_AWAY\",\"delay\":30}"); st("arming"); }
          else if (sc == "armed") { st("armed_away"); }
          else if (sc == "armed_home") { st("armed_home"); }
          else if (sc.rfind("pending", 0) == 0) { st("armed_away"); ev("{\"event\":\"TRIGGER\",\"delay\":30,\"sensors\":[{\"entity_id\":\"binary_sensor.front_door\",\"name\":\"Front Door\"}]}"); st("pending"); }
          else if (sc.rfind("triggered", 0) == 0) { st("armed_away"); ev("{\"event\":\"TRIGGER\",\"delay\":0,\"sensors\":[{\"entity_id\":\"binary_sensor.front_door\",\"name\":\"Front Door\"}]}"); st("triggered"); }
          else if (sc == "pin") { st("armed_away"); }
          else if (sc == "wrongpin") { st("armed_away"); }
      - delay: 300ms
      - lambda: |-
          std::string sc = getenv("SCENARIO") ? getenv("SCENARIO") : "disarmed";
          if (sc == "arming") id(countdown) = 22;
          if (sc.rfind("pending", 0) == 0) id(countdown) = 18;
          if (sc == "pin") { id(open_pin).execute(std::string("off")); }
          if (sc == "wrongpin") { id(open_pin).execute(std::string("off")); }
      - delay: 200ms
      - lambda: |-
          std::string sc = getenv("SCENARIO") ? getenv("SCENARIO") : "disarmed";
          if (sc == "pin") { for (auto k : {"4", "8", "1"}) id(press_key).execute(std::string(k)); }
          if (sc == "wrongpin") id(on_alarm_event).execute(std::string("{\"event\":\"INVALID_CODE_PROVIDED\"}"));
          if (sc == "pending_main" || sc == "triggered_main") id(close_pin).execute();
          id(refresh_ui).execute();
          id(refresh_pin).execute();
      - delay: 700ms
      - lambda: |-
          lv_refr_now(nullptr);
          lv_draw_buf_t *b = lv_snapshot_take(lv_screen_active(), LV_COLOR_FORMAT_RGB888);
          const char *path = getenv("SNAP") ? getenv("SNAP") : "/tmp/keypad.ppm";
          FILE *f = b ? fopen(path, "wb") : nullptr;
          if (f) {
            fprintf(f, "P6 %d %d 255\n", (int) b->header.w, (int) b->header.h);
            for (int y = 0; y < b->header.h; y++) {
              const uint8_t *row = b->data + y * b->header.stride;
              for (int x = 0; x < b->header.w; x++) {
                const uint8_t px[3] = {row[x * 3 + 2], row[x * 3 + 1], row[x * 3]};
                fwrite(px, 1, 3, f);
              }
            }
            fclose(f);
          }
          if (b) lv_draw_buf_destroy(b);
          exit(f ? 0 : 1);
